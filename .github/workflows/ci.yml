name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/analysis-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: services/analysis-api/requirements-dev.lock
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --config-file pyproject.toml src
      - run: python -m pytest -s

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Login and configuration gate E2E
        run: npm run test:e2e -- login.spec.ts
      - name: Authenticated workspace E2E (synthetic identities only)
        run: npm run test:e2e -- workspace.spec.ts
        env:
          PUBLIC_API_BASE_URL: http://127.0.0.1:8080
          PUBLIC_FIREBASE_API_KEY: ui-test-key
          PUBLIC_FIREBASE_AUTH_DOMAIN: ui-test.firebaseapp.com
          PUBLIC_FIREBASE_PROJECT_ID: ui-test
          PUBLIC_FIREBASE_APP_ID: ui-test-app

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan (immutable scanner, offline, redacted)
        run: |
          docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker run --rm --network none --read-only \
            -v "$GITHUB_WORKSPACE:/scan:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /scan --redact=100 --no-banner --gitleaks-ignore-path=/scan/.gitleaksignore
