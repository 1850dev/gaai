[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "analytics-ai"
version = "0.1.0"
description = "Security-first GA4 and BigQuery conversational analytics API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "analytics-mcp==0.7.0",
  "fastapi==0.141.1",
  "firebase-admin==7.5.0",
  "google-auth==2.56.3",
  "google-cloud-firestore==2.28.1",
  "google-cloud-storage==3.13.1",
  "google-genai==2.34.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlglot==30.17.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
  "types-cachetools==7.0.0.20260713",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_ai"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
plugins = ["pydantic.mypy"]
packages = ["analytics_ai"]
